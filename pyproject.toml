[project]
name = "snap-auto"
version = "0.2.0"
description = "A resilient synchronous Playwright client for Snapchat Web"
readme = "README.md"
license = "MIT"
authors = [
    { name = "AshweejaKR", email = "ashweejabhat23@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.62.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=snap_auto",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
testpaths = ["tests"]
markers = [
    "live: opt-in tests that access a real Snapchat test account",
    "live_send: opt-in test that sends one explicitly configured message",
]

[tool.coverage.run]
branch = true
source = ["snap_auto"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
